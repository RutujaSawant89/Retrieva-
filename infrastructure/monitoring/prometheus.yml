global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: retrieva-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The Celery main process aggregates metrics from all pool processes (multiprocess mode).
  - job_name: retrieva-worker
    static_configs:
      - targets: ["worker:9101"]
