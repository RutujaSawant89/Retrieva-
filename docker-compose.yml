# Retrieva — full stack.
#
#   cp .env.example .env            # then set the secrets
#   docker compose up -d --build    # http://localhost:8080
#   docker compose --profile monitoring up -d   # + Prometheus (9090) and Grafana (3000)
#
# Development overrides (hot reload, exposed ports): docker-compose.dev.yml

name: retrieva

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  DATABASE_URL: postgresql+psycopg://retrieva_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/retrieva
  MIGRATION_DATABASE_URL: postgresql+psycopg://retrieva:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/retrieva
  REDIS_URL: redis://redis:6379/0
  INGESTION_MODE: celery
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
  ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-true}
  EMBEDDING_PROVIDER: sentence-transformers
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross-encoder}
  HF_OFFLINE: ${HF_OFFLINE:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: retrieva
      POSTGRES_USER: retrieva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieva -d retrieva"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    image: retrieva-backend:latest
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: retrieva-backend:latest
    command: ["api"]
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  worker:
    image: retrieva-backend:latest
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: "9101"
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    image: retrieva-web:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["monitoring"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
