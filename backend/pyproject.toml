[project]
name = "retrieva-backend"
version = "0.1.0"
description = "Retrieva — Enterprise AI Retrieval & Intelligence Platform (API, workers, RAG engine)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "snowballstemmer>=2.2",
    "fpdf2>=2.7",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-exporter-otlp-proto-http>=1.26",
]

[project.optional-dependencies]
# Neural models (embeddings, cross-encoder reranking). Installed in Docker images and for
# benchmarks; the test suite runs without them using deterministic local providers.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
# Optional RAGAS adapter (requires an LLM provider key at run time).
ragas = ["ragas>=0.2"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"scripts/*" = ["S608"]
"alembic/*" = ["E501"]
